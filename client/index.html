<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LosJonys Arena</title>
    <!-- FontAwesome self-hosted (iconos UI — los accesorios usan emoji) -->
    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css" />
    <!-- Tipografías self-hosted (Google Fonts, OFL): Rajdhani (títulos/números) + Nunito (UI) -->
    <link rel="stylesheet" href="/assets/fonts/rajdhani/css/rajdhani.css" />
    <link rel="stylesheet" href="/assets/fonts/nunito/css/nunito.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0f0f0f;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* El contenedor DOM de Phaser (input de nombre) por encima del canvas */
      .phaser-dom-container {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
