<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fondo Animado</title>
<style>
  :root{
    --bg:#0f0f0f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    height:100vh;
    overflow:hidden;
  }
  #bg-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(circle at 50% 50%, rgba(15,15,15,0) 0%, rgba(15,15,15,.35) 100%);
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-veil"></div>

<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const N = 112; 
  const off = document.createElement('canvas');
  off.width = N; off.height = N;
  const offCtx = off.getContext('2d');
  const imgData = offCtx.createImageData(N, N);

  const PRESETS = [
    { f:0.055, k:0.062 }, 
    { f:0.026, k:0.055 }, 
    { f:0.014, k:0.054 }, 
    { f:0.035, k:0.065 }, 
    { f:0.018, k:0.051 }, 
    { f:0.030, k:0.058 }  
  ];
  const preset = PRESETS[Math.floor(Math.random()*PRESETS.length)];
  const Du = 0.16, Dv = 0.08, dt = 1.0;

  let u = new Float32Array(N*N).fill(1);
  let v = new Float32Array(N*N).fill(0);
  let u2 = new Float32Array(N*N);
  let v2 = new Float32Array(N*N);

  function idx(x,y){ return y*N + x; }

  function seedBlob(cx, cy, r){
    for(let y=-r; y<=r; y++){
      for(let x=-r; x<=r; x++){
        const d = Math.sqrt(x*x+y*y);
        if(d <= r){
          const xi = ((cx+x)%N+N)%N;
          const yi = ((cy+y)%N+N)%N;
          const i = idx(xi,yi);
          const jitter = 0.85 + Math.random()*0.3;
          u[i] = 0.5 * jitter;
          v[i] = 0.25 * jitter;
        }
      }
    }
  }

  const numBlobs = 5 + Math.floor(Math.random()*6);
  for(let b=0; b<numBlobs; b++){
    seedBlob(
      Math.floor(Math.random()*N),
      Math.floor(Math.random()*N),
      3 + Math.floor(Math.random()*5)
    );
  }
  for(let i=0; i<N*N; i++){
    if(Math.random() < 0.002){ v[i] = 0.4; u[i] = 0.4; }
  }

  function step(){
    for(let y=0; y<N; y++){
      const yN = (y-1+N)%N, yS = (y+1)%N;
      for(let x=0; x<N; x++){
        const xW = (x-1+N)%N, xE = (x+1)%N;
        const i = idx(x,y);
        const uC = u[i], vC = v[i];
        const lapU = u[idx(xW,y)] + u[idx(xE,y)] + u[idx(x,yN)] + u[idx(x,yS)] - 4*uC;
        const lapV = v[idx(xW,y)] + v[idx(xE,y)] + v[idx(x,yN)] + v[idx(x,yS)] - 4*vC;
        const reaction = uC * vC * vC;
        let nu = uC + (Du*lapU - reaction + preset.f*(1-uC)) * dt;
        let nv = vC + (Dv*lapV + reaction - (preset.f+preset.k)*vC) * dt;
        u2[i] = Math.min(1, Math.max(0, nu));
        v2[i] = Math.min(1, Math.max(0, nv));
      }
    }
    [u,u2] = [u2,u];
    [v,v2] = [v2,v];
  }

  function render(){
    const data = imgData.data;
    for(let i=0; i<N*N; i++){
      const val = Math.min(1, Math.max(0, v[i]));
      const p = i*4;
      data[p]   = 34;   
      data[p+1] = 211;  
      data[p+2] = 238;  
      data[p+3] = Math.round(val * 190); 
    }
    offCtx.putImageData(imgData, 0, 0);

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 0.55;
    ctx.drawImage(off, 0, 0, N, N, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const STEPS_PER_FRAME = 8;
  function loop(){
    for(let s=0; s<STEPS_PER_FRAME; s++) step();
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
